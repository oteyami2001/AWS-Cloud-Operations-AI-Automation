# Manual, approval-gated deployment of terraform/envs/dev. Nothing here runs automatically.
#
# Prerequisites (docs/deployment-plan.md):
#   1. terraform/bootstrap applied by an admin (state bucket, OIDC roles, boundary, ECR, budget)
#   2. Image pushed with the `image` workflow (plan fails if the tag is missing)
#   3. Repository variables: AWS_REGION, TF_STATE_BUCKET, AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN,
#      ALLOWED_INGRESS_CIDR (x.x.x.x/32), ALERT_EMAIL
#   4. GitHub environment "aws-dev": required reviewer = you, deployment branches = main only.
#      The apply role trusts ONLY this environment.
#
# Flow: plan (read-only role) -> reviewer approves the aws-dev environment -> apply of THAT saved plan.
name: deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan, apply or destroy
        type: choice
        options: [plan, apply, destroy]
        default: plan
      image_tag:
        description: Sample-app image tag (must exist in ECR)
        default: v1

permissions:
  contents: read
  id-token: write # OIDC - no long-lived AWS keys

concurrency:
  group: deploy-dev # never two runs against the same state
  cancel-in-progress: false

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "true"
  CHECKPOINT_DISABLE: "1"
  TF_VAR_allowed_ingress_cidrs: '["${{ vars.ALLOWED_INGRESS_CIDR }}"]'
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_image_tag: ${{ inputs.image_tag }}
  TF_VAR_region: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: terraform plan (${{ inputs.action }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build Lambda package
        run: scripts/build_lambda.sh
      - name: terraform init (S3 backend, native locking)
        working-directory: terraform/envs/dev
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: terraform plan
        working-directory: terraform/envs/dev
        run: |
          DESTROY=""
          if [ "${{ inputs.action }}" = "destroy" ]; then DESTROY="-destroy"; fi
          terraform plan -input=false -lock-timeout=5m $DESTROY -out=tfplan -no-color | tee plan.txt
          {
            echo "### terraform plan (${{ inputs.action }})"
            echo '```'
            grep -E '^Plan:|No changes|will be (created|destroyed|updated|replaced)' plan.txt | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          retention-days: 3
          path: |
            terraform/envs/dev/tfplan
            terraform/envs/dev/plan.txt
            build/lambda.zip

  apply:
    name: terraform ${{ inputs.action }} (requires aws-dev approval)
    needs: plan
    if: inputs.action != 'plan'
    runs-on: ubuntu-latest
    environment: aws-dev # required reviewer approves before ANY billable change
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
      - name: terraform apply (the exact plan that was reviewed)
        working-directory: terraform/envs/dev
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform apply -input=false -lock-timeout=5m tfplan
