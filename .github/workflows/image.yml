# Manual: build, scan and push the sample-app image to the bootstrap ECR repository.
# Runs only from main (the image-push role trusts refs/heads/main only). Tags are immutable in ECR,
# so pushing an existing tag fails instead of silently replacing a deployed image.
name: image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to publish (e.g. v1)
        required: true
        default: v1

# Explicit bash => GitHub runs every step with `bash --noprofile --norc -eo pipefail`, so a failure
# anywhere in a pipeline (e.g. `terraform plan | tee plan.txt`) fails the step instead of passing.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write # OIDC - no long-lived AWS keys

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "tag must look like v1 or v1.2.3"; exit 1; }'
      - name: Build
        run: docker build -t local/aiops-sample-app:scan src/sample_app
      - name: Trivy gate (HIGH/CRITICAL with fixes available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/aiops-sample-app:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push
        env:
          TAG: ${{ inputs.image_tag }}
          REPO_NAME: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag local/aiops-sample-app:scan "$REGISTRY/$REPO_NAME:$TAG"
          docker push "$REGISTRY/$REPO_NAME:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "### Pushed \`$REPO_NAME:$TAG\` → \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
