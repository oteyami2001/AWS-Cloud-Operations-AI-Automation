[project]
name = "aws-aiops-cloud-operations-platform"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# botocore (third-party) still calls datetime.utcnow(); our own code must stay warning-free.
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:botocore"]

[tool.coverage.run]
source = ["src/aiops"]
omit = ["src/aiops/handlers/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "N818", "UP042", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"scripts/**" = ["S603", "S607", "S310", "E402"]

[tool.bandit]
exclude_dirs = ["tests", "build"]
